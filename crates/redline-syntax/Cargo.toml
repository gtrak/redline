[package]
name = "redline-syntax"
version = "0.1.0"
edition = "2024"
description = "Syntax highlighting for redline: tree-sitter grammar registry, highlight pipeline, and cache (plain Rust — zero iocraft/tokio, plan layering rule)"

# issue-guardrails: workspace lints (undocumented_unsafe_blocks deny —
# every `unsafe` block needs a `// SAFETY:` comment; see the root
# Cargo.toml's [workspace.lints] for the rationale).
[lints]
workspace = true

[dependencies]
# ── text model ──────────────────────────────────────────────────────────────
ropey = "1.6.1"

# ── logging (the moved registry.rs logs a `tracing::warn!` on a failed
# highlight config; plain log facade — the crate's layering rule bans
# iocraft/tokio, not tracing) ───────────────────────────────────────────────
tracing = "0.1.44"

# ── syntax: tree-sitter 0.25 family ────────────────────────────────────────
# The runtime moved to 0.25.x (the runtime-bump task): the grammar crates'
# `tree-sitter` (runtime) requirements are DEV-dependencies — they do not
# constrain which runtime THIS build links. The normal dependency is
# `tree-sitter-language ^0.1` (the `LanguageFn` ABI bridge), and every
# pinned grammar below is ABI 13–15, inside the 0.25.10 ABI window
# (13..=15) — verified by the `all_grammars_set_language_succeeds` guard.
# One runtime in the lock (the 001/007 ABI-pinning rule); the full
# compatibility matrix (per-crate evidence, chosen version rationale,
# the 0.25-generation releases that could be a follow-up lane) lives in
# docs/tree-sitter-runtime-matrix.md.
tree-sitter = "=0.25.10"
tree-sitter-highlight = "=0.25.10"  # requires tree-sitter ^0.25.10 (1:1 tracking)
# Query-iterator adapter (tree-sitter's QueryCaptures/QueryMatches implement
# streaming-iterator::StreamingIterator, not std Iterator). Already in the
# lock as a transitive dep of tree-sitter; named here so symbol queries
# (issue 05) can iterate captures. Exact pin = no version change / no refetch.
streaming-iterator = "=0.1.9"
# ── grammar pins (the compatibility matrix + verdict table:
# docs/tree-sitter-runtime-matrix.md) ──────────────────────────────────────
# The nine 0.25-generation bumps landed in the grammar-bumps lane (the
# per-bump verdict table in docs/tree-sitter-runtime-matrix.md); the rest
# are the newest releases in the index. Every pin resolves against 0.25.10
# (its `tree-sitter` requirement is a dev-dependency — no runtime
# constraint) and its grammar ABI (13–15) is inside the 0.25.10 window
# (13..=15) — verified by the `all_grammars_set_language_succeeds` guard.
# DO NOT casually bump them: a grammar bump changes the grammar binary and
# therefore the parses — a per-grammar drift decision (the nine already
# taken each carried a full workspace evidence run; see the verdict table).
tree-sitter-rust = "=0.24.2"      # 0.25-gen bump (grammar-bumps lane): ABI in-window, full workspace evidence clean (docs/tree-sitter-runtime-matrix.md verdict table); do NOT bump further
tree-sitter-javascript = "=0.25.0"  # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-typescript = "0.23.2"  # provides both TS and TSX grammars
tree-sitter-python = "=0.25.0"  # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-go = "=0.25.0"  # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-c = "=0.24.2"      # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "=0.25.1"    # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "=0.7.2"     # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-md = "=0.5.1"        # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further (0.5.2+ want ^0.26)
tree-sitter-toml-ng = "0.7.0"      # maintained TOML grammar; the original
                                   # `tree-sitter-toml` is stuck at ^0.20
# New-languages lane (Java / C# / Ruby / Scheme): exact `=` pins — verified
# `set_language` against the pinned 0.25.10 runtime (the ABI-pinning rule,
# 001/007 lesson). The c-sharp 0.23.5 (0.25-gen) release is taken —
# grammar-bumps lane; verdict table in docs/tree-sitter-runtime-matrix.md.
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"    # 0.25-gen bump (grammar-bumps lane): full workspace evidence run on the new pin before keep (verdict table in docs/tree-sitter-runtime-matrix.md); do NOT bump further
tree-sitter-ruby = "=0.23.1"
tree-sitter-scheme = "=0.24.7"
tree-sitter-clojure = "=0.1.0"

[dev-dependencies]
# Test fixtures (the go module-discovery walk, the conventions rows that
# read a project's own go.mod): already in the lock at the workspace
# pin.
tempfile = "3.27"
