# Probe spec for the 011-08 js-lane golden corpus (crates/redline-resolve).
#
# One [[probe]] per probe point. Fields:
#   id       — golden file name (golden/<id>.golden); unique.
#   file     — corpus file the probe is anchored at (workspace-relative).
#   line     — 1-based anchor line (the use site, or a documented probe
#              anchor comment for shapes with no honest live use site).
#   symbol   — the symbol as the app navigates to it (bare or path-shaped,
#              e.g. `local.add`).
#   scope    — the app's tree-sitter import hint (the full path the symbol
#              resolves to, item included; [] = no hint — the app produced
#              nothing).
#   language — context language when the corpus file is TypeScript
#              (omitted = language-None context: every provider would be
#              tried; here only the JS provider is registered).
#   ws       — "corpus" = probe in a tempdir copy of this corpus (the
#              provider's canonical workspace); "empty" = a bare tempdir
#              with no package.json anywhere down from it.
#   mode     — "deterministic" (offline provider: NO shell-outs, byte
#              stable on any machine) | "online-deterministic" (online
#              provider, probe shape bails before any npm spawn — no
#              network needed) | "live" (real `npm install`; skipped
#              LOUDLY when npm/node are absent from PATH).
#   note     — why this probe exists; the honest-degradation bails are
#              pinned here on purpose.
#
# 011-08 fix-jsrel P2-7 (`e2281a2`): the relative probes' `scope`
# values are no longer a forward-looking contract pin — the app now
# EMITS them (`js_ts_specifier` accepts `./…` / `../…` specifiers). The
# goldens keep pinning the provider's landed behavior, unchanged.
#
# Expected outcomes live in golden/<id>.golden — a resolution (external,
# source_root, file, line) or the EXACT bail message (byte-for-byte,
# workspace root normalized to <ws>).

# ── landings: the local (file:) dependency, external = false ────────────────

