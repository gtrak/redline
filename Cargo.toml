[workspace]
members = ["crates/*"]
resolver = "2"

# issue-guardrails (part B): every `unsafe` block in the workspace must
# carry a `// SAFETY:` comment naming the invariant that makes it sound.
# VERIFIED ON THIS TOOLCHAIN (rustc/clippy 1.97.1, 2026-07-14): this is a
# CLIPPY lint, not a rustc lint — rustc rejects the bare name
# (`unknown lint: undocumented_unsafe_blocks`) and clippy asks that it be
# addressed as `clippy::undocumented_unsafe_blocks` (currently
# deprecated-but-functional on this toolchain; the part-B negative test
# proves it fires here). Consequence: it only fires under `cargo clippy`,
# so the enforcement point is the gate (tools/gate.sh — every tier runs
# clippy) and the pre-push hook, not plain `cargo build`.
[workspace.lints.rust]
# The workspace currently has NO `unsafe fn`; deny so one can never
# appear and silently un-check its inner unsafe ops (that lint is
# allow-by-default on `unsafe fn` bodies).
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "redline"
version = "0.1.0"
edition = "2024"
description = "Read-focused, emacs-flavored TUI code browser for the agent-coding loop"

[lints]
workspace = true

[dependencies]
# ── UI layer ────────────────────────────────────────────────────────────────
iocraft = "0.9.1"          # declarative TUI (latest 0.9.1; re-exports crossterm events)
# UPGRADE LIABILITY (plan 013-02): iocraft is VENDORED at vendor/iocraft and
# pinned by the [patch.crates-io] section below. The vendor tree carries a
# ~30-line patch (use_cursor_position: the app declares its hardware-cursor
# cell and the backend emits Show + CUP after the canvas park, inside the
# frame's synchronized region — program order instead of redline's old
# detached 12 ms sleep race). The pin is 0.9.1: every future iocraft bump
# must re-apply or drop this patch (re-copy the new registry source into
# vendor/iocraft and re-port the hunks, or upstream the API and delete the
# patch + this section).
crossterm = "0.29"         # pinned to match iocraft's `^0.29` requirement exactly
# Display-width (wide/CJK + combining) math at the render/input boundary
# (plan 004 issue 05d). deps batch B bumped the direct dep 0.1.14 -> 0.2.2
# (Unicode 17.0 tables); iocraft 0.9.1 still pins ^0.1.13, so 0.1.14 stays
# in the lock as its transitive dep (see tools/unicode_width_sweep.md).
unicode-width = "0.2.2"

# ── async runtime + observability ──────────────────────────────────────────
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# ── text model ──────────────────────────────────────────────────────────────
ropey = "1.6.1"

# ── syntax: tree-sitter 0.25 family ────────────────────────────────────────
# The 19 grammar/highlight pins — with their ABI-pinning verdicts and the
# "do NOT bump further" rules — moved to crates/redline-syntax/Cargo.toml
# (plan 014 stage 1, src/syntax/ became the redline-syntax crate). The
# runtime itself stays a direct bin dependency:
# src/app/store/navigation/imports.rs and src/app/store/notes.rs parse with
# `tree_sitter::` directly. The same exact pin as redline-syntax keeps the
# one-runtime-in-the-lock rule (001/007) intact; the full compatibility
# matrix lives in docs/tree-sitter-runtime-matrix.md.
tree-sitter = "=0.25.10"
# Workspace crate (plan 014 stage 1): the moved src/syntax/ — grammar
# registry, highlight pipeline, cache. Path dep, reviewed separately.
redline-syntax = { path = "crates/redline-syntax" }

# ── fuzzy matching (helm-style pickers) ────────────────────────────────────
nucleo-matcher = "0.3.1"   # add `nucleo = "0.5"` later if streaming sources needed

# ── search (embedded ripgrep) ───────────────────────────────────────────────
ignore = "0.4.33"          # gitignore-aware parallel walk
grep-searcher = "0.1.17"
grep-regex = "0.1.14"

# ── git (magit subset) ──────────────────────────────────────────────────────
git2 = "0.21"

# ── file watching (live repo) ───────────────────────────────────────────────
notify = "8.2"
notify-debouncer-full = "0.7"  # requires notify ^8.2 — same family

# ── config, errors, misc ────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
anyhow = "1.0.104"
thiserror = "2.0.20"
dirs = "7.0"
rayon = "1.12"

# ── tooling-aware jump fall-through (plan 006) ─────────────────────────────
# M-. workspace misses fall through to this resolver chain (cargo metadata →
# registry source dir, cargo fetch on demand). Path dep: the crate lives in
# this workspace and is reviewed separately.
redline-resolve = { path = "crates/redline-resolve" }

[dev-dependencies]
tempfile = "3.27"
insta = "1.48"
# The OLD unicode-width table, dev-only: the full-domain sweep example
# (examples/unicode_width_sweep.rs, deps batch B) diffs 0.1.14 against the
# current table so the recorded 458-scalar delta is regeneratable from the
# repo. Dev-only — never linked into the shipped binary.
unicode-width-old = { package = "unicode-width", version = "=0.1.14" }

# Plan 013-02: pin the vendored, patched iocraft 0.9.1 (see the upgrade
# liability comment above). The patch adds `use_cursor_position`; until it
# lands upstream, a plain crates.io bump would silently lose the fix.
[patch.crates-io]
iocraft = { path = "vendor/iocraft" }
