[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "redline"
version = "0.1.0"
edition = "2024"
description = "Read-focused, emacs-flavored TUI code browser for the agent-coding loop"

[dependencies]
# ── UI layer ────────────────────────────────────────────────────────────────
iocraft = "0.9.1"          # declarative TUI (latest 0.9.1; re-exports crossterm events)
crossterm = "0.29"         # pinned to match iocraft's `^0.29` requirement exactly
# Display-width (wide/CJK + combining) math at the render/input boundary
# (plan 004 issue 05d). Already in the tree as a transitive dep of iocraft
# (v0.1.14); the standard crate for terminal cell widths.
unicode-width = "0.1.14"

# ── async runtime + observability ──────────────────────────────────────────
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# ── text model ──────────────────────────────────────────────────────────────
ropey = "1.6.1"

# ── syntax: tree-sitter 0.25 family ────────────────────────────────────────
# The 19 grammar/highlight pins — with their ABI-pinning verdicts and the
# "do NOT bump further" rules — moved to crates/redline-syntax/Cargo.toml
# (plan 014 stage 1, src/syntax/ became the redline-syntax crate). The
# runtime itself stays a direct bin dependency: 
# src/app/store/navigation/imports.rs and src/app/store/notes.rs parse with
# `tree_sitter::` directly. The same exact pin as redline-syntax keeps the
# one-runtime-in-the-lock rule (001/007) intact; the full compatibility
# matrix lives in docs/tree-sitter-runtime-matrix.md.
tree-sitter = "=0.25.10"
# Workspace crate (plan 014 stage 1): the moved src/syntax/ — grammar
# registry, highlight pipeline, cache. Path dep, reviewed separately.
redline-syntax = { path = "crates/redline-syntax" }

# ── fuzzy matching (helm-style pickers) ────────────────────────────────────
nucleo-matcher = "0.3.1"   # add `nucleo = "0.5"` later if streaming sources needed

# ── search (embedded ripgrep) ───────────────────────────────────────────────
ignore = "0.4.33"          # gitignore-aware parallel walk
grep-searcher = "0.1.17"
grep-regex = "0.1.14"

# ── git (magit subset) ──────────────────────────────────────────────────────
git2 = "0.21"

# ── file watching (live repo) ───────────────────────────────────────────────
notify = "8.2"
notify-debouncer-full = "0.7"  # requires notify ^8.2 — same family

# ── config, errors, misc ────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
anyhow = "1.0.104"
thiserror = "2.0.20"
dirs = "7.0"
rayon = "1.12"

# ── tooling-aware jump fall-through (plan 006) ─────────────────────────────
# M-. workspace misses fall through to this resolver chain (cargo metadata →
# registry source dir, cargo fetch on demand). Path dep: the crate lives in
# this workspace and is reviewed separately.
redline-resolve = { path = "crates/redline-resolve" }

[dev-dependencies]
tempfile = "3.27"
insta = "1.48"
