[workspace]
members = ["crates/*"]
resolver = "2"

# issue-guardrails (part B): every `unsafe` block in the workspace must
# carry a `// SAFETY:` comment naming the invariant that makes it sound.
# VERIFIED ON THIS TOOLCHAIN (rustc/clippy 1.97.1, 2026-07-14): this is a
# CLIPPY lint, not a rustc lint — rustc rejects the bare name
# (`unknown lint: undocumented_unsafe_blocks`) and clippy asks that it be
# addressed as `clippy::undocumented_unsafe_blocks` (currently
# deprecated-but-functional on this toolchain; the part-B negative test
# proves it fires here). Consequence: it only fires under `cargo clippy`,
# so the enforcement point is the gate (tools/gate.sh — every tier runs
# clippy) and the pre-push hook, not plain `cargo build`.
[workspace.lints.rust]
# The workspace currently has NO `unsafe fn`; deny so one can never
# appear and silently un-check its inner unsafe ops (that lint is
# allow-by-default on `unsafe fn` bodies).
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "redline"
version = "0.1.0"
edition = "2024"
description = "Read-focused, emacs-flavored TUI code browser for the agent-coding loop"

[lints]
workspace = true

[dependencies]
# ── UI layer ────────────────────────────────────────────────────────────────
iocraft = "0.9.1"          # declarative TUI (patched: see [patch.crates-io])
# UPGRADE LIABILITY (plan 013-02): iocraft is patched with ONE added API,
# `use_cursor_position` — the app declares its hardware-cursor cell and the
# backend emits Show + CUP after the canvas park, inside the frame's
# synchronized region, which replaces redline's old detached-write race
# (~2% of frames) with program order. The patched crate lives in a FORK at
# github.com/gtrak/iocraft, branch `redline-cursor-seam`, based on upstream's
# `iocraft-v0.9.1` tag and pinned by commit in [patch.crates-io] below.
#
# Why a fork and not a local patch: `[patch]` REPLACES a package's source —
# it cannot merge files into another crate — and the path form could not
# serve `cargo install --git` at all, because `[patch]` paths are resolved
# during manifest loading, before any build step (or build.rs, or script)
# can materialize them. So the patch is carried as a real crate source in the
# fork, and redline's own copy of the diff is kept at
# patches/iocraft-0.9.1-use_cursor_position.patch for reference and upstreaming.
# Every future iocraft bump must rebase that branch and move this pin (or
# upstream the API and delete the fork + this section).
crossterm = "0.29"         # pinned to match iocraft's `^0.29` requirement exactly
# Display-width (wide/CJK + combining) math at the render/input boundary
# (plan 004 issue 05d). deps batch B bumped the direct dep 0.1.14 -> 0.2.2
# (Unicode 17.0 tables); iocraft 0.9.1 still pins ^0.1.13, so 0.1.14 stays
# in the lock as its transitive dep (see tools/unicode_width_sweep.md).
unicode-width = "0.2.2"

# ── async runtime + observability ──────────────────────────────────────────
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# ── text model ──────────────────────────────────────────────────────────────
ropey = "1.6.1"

# ── syntax: tree-sitter 0.25 family ────────────────────────────────────────
# The 19 grammar/highlight pins — with their ABI-pinning verdicts and the
# "do NOT bump further" rules — moved to crates/redline-syntax/Cargo.toml
# (plan 014 stage 1, src/syntax/ became the redline-syntax crate). The
# runtime itself stays a direct bin dependency:
# src/app/store/navigation/imports.rs and src/app/store/notes.rs parse with
# `tree_sitter::` directly. The same exact pin as redline-syntax keeps the
# one-runtime-in-the-lock rule (001/007) intact; the full compatibility
# matrix lives in docs/tree-sitter-runtime-matrix.md.
tree-sitter = "=0.25.10"
# Workspace crate (plan 014 stage 1): the moved src/syntax/ — grammar
# registry, highlight pipeline, cache. Path dep, reviewed separately.
redline-syntax = { path = "crates/redline-syntax" }

# ── fuzzy matching (helm-style pickers) ────────────────────────────────────
nucleo-matcher = "0.3.1"   # add `nucleo = "0.5"` later if streaming sources needed

# ── search (embedded ripgrep) ───────────────────────────────────────────────
ignore = "0.4.33"          # gitignore-aware parallel walk
grep-searcher = "0.1.17"
grep-regex = "0.1.14"

# ── git (magit subset) ──────────────────────────────────────────────────────
git2 = "0.21"

# ── file watching (live repo) ───────────────────────────────────────────────
notify = "8.2"
notify-debouncer-full = "0.7"  # requires notify ^8.2 — same family

# ── config, errors, misc ────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
anyhow = "1.0.104"
thiserror = "2.0.20"
dirs = "7.0"
rayon = "1.12"

# ── tooling-aware jump fall-through (plan 006) ─────────────────────────────
# M-. workspace misses fall through to this resolver chain (cargo metadata →
# registry source dir, cargo fetch on demand). Path dep: the crate lives in
# this workspace and is reviewed separately.
redline-resolve = { path = "crates/redline-resolve" }

[dev-dependencies]
tempfile = "3.27"
insta = "1.48"
# The OLD unicode-width table, dev-only: the full-domain sweep example
# (examples/unicode_width_sweep.rs, deps batch B) diffs 0.1.14 against the
# current table so the recorded 458-scalar delta is regeneratable from the
# repo. Dev-only — never linked into the shipped binary.
unicode-width-old = { package = "unicode-width", version = "=0.1.14" }

# Plan 013-02: pin the FORKED iocraft that carries the `use_cursor_position`
# seam (see the upgrade liability comment above). A git source rather than a
# local path: `cargo install --git` must resolve it with no local step, and
# Cargo finds the crate inside the fork's `packages/iocraft/` automatically.
# The branch is based on upstream's `iocraft-v0.9.1` tag, and the tree is
# byte-identical to the previously-vendored patched crate for the five
# touched files — so this changes the SOURCE LOCATION, not the built code.
# Until the API lands upstream, a plain crates.io bump would silently lose
# the fix; redline's copy of the diff is kept at
# patches/iocraft-0.9.1-use_cursor_position.patch for upstreaming.
[patch.crates-io]
iocraft = { git = "https://github.com/gtrak/iocraft", rev = "e3dc128bfe5416387489a52286d6f22eaa2ba657" }
# Pinned by REV, not branch: `cargo install --git` ignores Cargo.lock, so a
# branch pin would let a later push to the fork change what an install
# compiles without any redline commit. The rev is the `redline-cursor-seam`
# branch head at the time of writing; to move it, push to the fork and update
# this hash in the same redline commit. (The gate asserts this stanza still
# points at a git source — see tools/gate.sh — because a stray
# `cargo update` or a deleted stanza would silently restore unpatched
# crates.io iocraft. The compile itself is also a backstop: redline calls
# `hooks.use_cursor_position`, which does not exist in pristine 0.9.1.)
